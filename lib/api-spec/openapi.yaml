openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Treasure KC Nexus API - LLC Discovery and Recruitment Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: llcs
    description: LLC filing operations
  - name: dashboard
    description: Dashboard statistics
  - name: webhook
    description: Webhook integration
  - name: worker
    description: Ingestion worker operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /new_llcs:
    get:
      operationId: getNewLlcs
      tags: [llcs]
      summary: Get new LLC filings
      description: Returns fresh LLC filings from Kansas and/or Missouri SOS records
      parameters:
        - name: state
          in: query
          description: State code (KS, MO, or ALL)
          schema:
            type: string
            default: ALL
        - name: date
          in: query
          description: Filing date filter (YYYY-MM-DD), defaults to yesterday
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of new LLC filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewLlcsResponse"

  /fresh_llcs:
    get:
      operationId: getFreshLlcs
      tags: [llcs]
      summary: Get today's fresh LLC filings
      description: Public JSON endpoint for the latest daily LLC filing feed
      parameters:
        - name: state
          in: query
          description: State code (KS, MO, or ALL)
          schema:
            type: string
            default: ALL
        - name: date
          in: query
          description: Filing date filter (YYYY-MM-DD), defaults to today
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Public list of fresh LLC filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewLlcsResponse"

  /llcs:
    get:
      operationId: getLlcs
      tags: [llcs]
      summary: List all stored LLC filings
      description: Returns all LLC filings stored in the database with optional filters
      parameters:
        - name: state
          in: query
          description: Filter by state code (KS, MO)
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          description: Search by LLC name or city
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of LLC filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlcListResponse"

  /llcs/{id}:
    get:
      operationId: getLlcById
      tags: [llcs]
      summary: Get LLC by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LLC filing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlcFiling"
        "404":
          description: LLC not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /llcs/{id}/recruit:
    post:
      operationId: markLlcRecruited
      tags: [llcs]
      summary: Mark an LLC as recruited / contacted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruitBody"
      responses:
        "200":
          description: Updated LLC filing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlcFiling"
        "404":
          description: LLC not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /llcs/scrape:
    post:
      operationId: triggerScrape
      tags: [llcs]
      summary: Trigger a manual scrape / data refresh
      description: Runs the simulated scraper for the given state and stores results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeBody"
      responses:
        "200":
          description: Scrape results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent LLC filings activity feed
      parameters:
        - name: limit
          in: query
          description: Number of recent items
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlcFiling"

  /dashboard/by-city:
    get:
      operationId: getLlcsByCity
      tags: [dashboard]
      summary: Get LLC counts grouped by city
      responses:
        "200":
          description: City breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityCount"

  /llcs/{id}/outreach:
    post:
      operationId: generateOutreach
      tags: [llcs]
      summary: Generate AI outreach message for an LLC using Grok
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachBody"
      responses:
        "200":
          description: Generated outreach message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachResponse"
        "404":
          description: LLC not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhook/config:
    get:
      operationId: getWebhookConfig
      tags: [webhook]
      summary: Get webhook configuration
      responses:
        "200":
          description: Current webhook configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookConfig"

  /webhook/test:
    post:
      operationId: testWebhook
      tags: [webhook]
      summary: Send a test webhook payload
      responses:
        "200":
          description: Test webhook dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResponse"

  /worker/ingestion-runs:
    get:
      operationId: getWorkerIngestionRuns
      tags: [worker]
      summary: Get ingestion worker run status
      responses:
        "200":
          description: Worker ingestion run snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerIngestionRunsResponse"
        "500":
          description: Test webhook failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LlcFiling:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        filingId:
          type: ["string", "null"]
        state:
          type: string
        status:
          type: string
        filingDate:
          type: string
        agentName:
          type: ["string", "null"]
        agentAddress:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        recruited:
          type: boolean
        recruitedAt:
          type: ["string", "null"]
        recruitNote:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - state
        - status
        - filingDate
        - recruited
        - createdAt

    NewLlcsResponse:
      type: object
      properties:
        date:
          type: string
        state:
          type: string
        total:
          type: integer
        llcs:
          type: array
          items:
            $ref: "#/components/schemas/LlcFiling"
      required:
        - date
        - state
        - total
        - llcs

    LlcListResponse:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        llcs:
          type: array
          items:
            $ref: "#/components/schemas/LlcFiling"
      required:
        - total
        - offset
        - limit
        - llcs

    RecruitBody:
      type: object
      properties:
        note:
          type: ["string", "null"]
      required: []

    ScrapeBody:
      type: object
      properties:
        state:
          type: string
          description: State to scrape (KS, MO, or ALL)
          default: ALL
        date:
          type: ["string", "null"]
          description: Date to scrape for (YYYY-MM-DD), defaults to today
      required: []

    ScrapeResult:
      type: object
      properties:
        state:
          type: string
        date:
          type: string
        found:
          type: integer
        stored:
          type: integer
        message:
          type: string
      required:
        - state
        - date
        - found
        - stored
        - message

    DashboardStats:
      type: object
      properties:
        totalLlcs:
          type: integer
        todayLlcs:
          type: integer
        kansasLlcs:
          type: integer
        missouriLlcs:
          type: integer
        recruitedCount:
          type: integer
        pendingRecruitment:
          type: integer
        lastScrapeAt:
          type: ["string", "null"]
      required:
        - totalLlcs
        - todayLlcs
        - kansasLlcs
        - missouriLlcs
        - recruitedCount
        - pendingRecruitment

    CityCount:
      type: object
      properties:
        city:
          type: string
        state:
          type: string
        count:
          type: integer
      required:
        - city
        - state
        - count

    OutreachBody:
      type: object
      properties:
        tone:
          type: string
          description: Tone of message (friendly, professional, casual)
          default: friendly
      required: []

    OutreachResponse:
      type: object
      properties:
        llcId:
          type: integer
        llcName:
          type: string
        message:
          type: string
        tone:
          type: string
      required:
        - llcId
        - llcName
        - message
        - tone

    WebhookConfig:
      type: object
      properties:
        webhookUrl:
          type: string
        hasSecret:
          type: boolean
        status:
          type: string
      required:
        - webhookUrl
        - hasSecret
        - status

    WebhookTestResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: ["string", "null"]
      required:
        - success
        - message

    IngestionRun:
      type: object
      properties:
        id:
          type: integer
        sourceId:
          type: string
        runAt:
          type: string
        recordsProcessed:
          type: integer
        added:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        errorMessage:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - sourceId
        - runAt
        - recordsProcessed
        - added
        - updated
        - failed
        - status

    WorkerIngestionRunsResponse:
      type: object
      properties:
        currentRun:
          anyOf:
            - $ref: "#/components/schemas/IngestionRun"
            - type: "null"
        lastRun:
          anyOf:
            - $ref: "#/components/schemas/IngestionRun"
            - type: "null"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/IngestionRun"
      required:
        - currentRun
        - lastRun
        - recentRuns
